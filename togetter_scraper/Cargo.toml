[package]
name = "togetter_scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.19"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"